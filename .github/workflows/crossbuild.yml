name: Cross-build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The five-platform law (R-2026-08-19): Linux, macOS, Windows,
          # Android, iOS — always. Executables build on the first four;
          # the Go toolchain cannot link ANY CGO-off ios executable, so
          # the ios row builds every library package (iOS ships through
          # the gomobile mobile/ path, which is covered here).
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: windows, goarch: amd64 }
          - { goos: android, goarch: arm64, cgo: "0" }
          - { goos: ios, goarch: arm64, cgo: "0", packages: "./internal/... ./mobile/" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # One exact toolchain, matching the dev8 gate (AGENTS.md §7).
          go-version: "1.27.0"
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo || '0' }}
        run: go build -ldflags "-X github.com/aiii-dot-id/aii-os/internal/app.Version=${{ steps.version.outputs.version }}" ${{ matrix.packages || './...' }}
