name: Shells

# The Kotlin and Swift halves of the five-platform law: the Go matrix
# (crossbuild.yml) proves the libraries; this proves the artifacts the
# operator installs. Before it, neither shell was compiled by any
# workflow — a Kotlin typo would have shipped.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Bind AAR (versions pinned by tools.go via go.mod)
        env:
          GOFLAGS: -buildvcs=false # gomobile's temp module breaks VCS stamping
        run: |
          # app/libs/ is gitignored (the .aar is a build product) and
          # gomobile will not create the output directory itself —
          # found on the first public CI run.
          mkdir -p shells/android/app/libs
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          gomobile bind -target=android/arm64 -androidapi 26 -ldflags "-X github.com/aiii-dot-id/aii-os/mobile.BuildCommit=$GITHUB_SHA" -o shells/android/app/libs/aiios.aar ./mobile
      - name: Assemble (committed wrapper)
        run: cd shells/android && ./gradlew --no-daemon assembleDebug

  ios:
    # macos-15: Xcode 16 by default. The macos-14 runner's Xcode 15.4
    # cannot read the project format current xcodegen emits (77) —
    # found on the first public CI run.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - name: Bind XCFramework (versions pinned by tools.go via go.mod)
        env:
          GOFLAGS: -buildvcs=false # gomobile's temp module breaks VCS stamping
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          gomobile bind -target=ios -ldflags "-X github.com/aiii-dot-id/aii-os/mobile.BuildCommit=$GITHUB_SHA" -o shells/ios/Mobile.xcframework ./mobile
      - name: Generate project and build unsigned
        run: |
          brew install xcodegen
          cd shells/ios
          xcodegen generate
          xcodebuild -project AIIOS.xcodeproj -scheme AIIOS -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO build
