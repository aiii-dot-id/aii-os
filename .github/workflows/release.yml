
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read  # BUILD ONLY. Publishing is packaging/release.sh's act.

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, archive: tar.gz }
          - { goos: linux,   goarch: arm64, archive: tar.gz }
          - { goos: windows, goarch: amd64, archive: zip }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Map platform name
        id: platform
        run: |
          case "${{ matrix.goos }}" in
            linux)   echo "name=linux"   >> "$GITHUB_OUTPUT" ;;
            darwin)  echo "name=macos"   >> "$GITHUB_OUTPUT" ;;
            windows) echo "name=windows" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Set binary name
        id: bins
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            echo "aii=aii.exe" >> "$GITHUB_OUTPUT"
          else
            echo "aii=aii" >> "$GITHUB_OUTPUT"
          fi
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          static=""
          if [ "${{ matrix.goos }}" = "linux" ]; then static="-d"; fi
          go build -ldflags "$static" \
            -o ${{ steps.bins.outputs.aii }} ./cmd/aii
      - name: Build Vulkan probe (Linux)
        if: matrix.goos == 'linux'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o aii-vulkan-probe ./cmd/aii-vulkan-probe
      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          archive="aii-os_${{ steps.version.outputs.version }}_${{ steps.platform.outputs.name }}_${{ matrix.goarch }}.tar.gz"
          tar czf "$archive" ${{ steps.bins.outputs.aii }} aii-vulkan-probe
          echo "archive=$archive" >> "$GITHUB_ENV"
      - name: Archive (zip)
        if: matrix.archive == 'zip'
        run: |
          archive="aii-os_${{ steps.version.outputs.version }}_${{ steps.platform.outputs.name }}_${{ matrix.goarch }}.zip"
          zip "$archive" ${{ steps.bins.outputs.aii }}
          echo "archive=$archive" >> "$GITHUB_ENV"
      - name: Compute SHA256
        run: sha256sum "$archive" | tee "${{ env.archive }}.sha256"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aii-os-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256

  build-mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: android, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile
          go install golang.org/x/mobile/cmd/gobind
          gomobile init
      - name: Build Android binding
        if: matrix.platform == 'android'
        env:
          CGO_ENABLED: "0"
        run: |
          archive="aii-os_${{ steps.version.outputs.version }}_android_arm64.aar"
          GOFLAGS=-buildvcs=false gomobile bind -target=android/arm64 \
            -o "$archive" ./mobile/
          echo "archive=$archive" >> "$GITHUB_ENV"
      - name: Compute SHA256
        if: env.archive != ''
        run: sha256sum "$archive" | tee "${{ env.archive }}.sha256"
      - name: Upload build artifact
        if: env.archive != ''
        uses: actions/upload-artifact@v4
        with:
          name: aii-os-${{ matrix.platform }}-${{ matrix.goarch }}
          path: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256
