
name: Genesis drift

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  live-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: Live chain against aiii.id
        env:
          LIVE_SMOKE: "1"
          GOTOOLCHAIN: local
        run: go test ./internal/genesis/ -run TestLiveChainSmoke -count=1 -v
