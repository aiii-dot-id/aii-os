name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # One exact toolchain, matching the the build host gate.
          go-version: "1.27.0"

      - name: Format
        # gofmt is a gate, not advice: vet does not check formatting, and
        # a drifted file landed (export/export.go, fixed
        # alongside this gate) and haunted the working tree for days.
        # Fail fast, name the offenders.
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then
            echo "gofmt drift in:" >&2
            echo "$drift" >&2
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        # vet does not find unused symbols, ineffectual compiler
        # directives, or dead branches. staticcheck does — on its first
        # run against this tree it found 45 issues that a careful manual
        # pass had missed, including an entire feature's worth of
        # unreachable code. The version is pinned in go.mod's tool block
        # so this is reproducible rather than dependent on whatever is
        # installed on the runner.
        run: ./test/run_staticcheck.sh

      - name: Race scope runner falsification
        # The runner is part of the gate. Prove that its partition accepts an
        # exact plan and rejects both an omission and a duplicate before any
        # matrix row relies on it.
        run: ./test/run_race_scope.sh self-test

  race:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Go already parallelizes packages. Only the five packages whose
        # serial top-level tests dominate wall time are partitioned further;
        # rest contains every other package. The runner verifies exact-once
        # assignment before executing a sharded package.
        scope: [app, dashboard, identity, store, pluginhost, rest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      # The native-T3 containment tests refuse to run an uncontained
      # plugin child (their own typed refusal says so); the runner
      # image does not carry bubblewrap. Found on the first public CI
      # run.
      - name: Containment dependency
        # Native containment executes only in internal/pluginhost. Other rows
        # do not install an unused tool.
        if: matrix.scope == 'pluginhost'
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap

      - name: Race (${{ matrix.scope }})
        env:
          AII_TEST_SHARDS: "4"
          # The runner image's Edge hangs sized headless windows (the
          # phone-width and layout journeys time out at 60s while the
          # same journeys pass in its Chrome and Firefox).
          # Name the engines this pipeline vouches for; the build host's gate
          # runs all three. Owed: the runner-Edge hazard root-caused,
          # then this narrowing retired.
          AII_BROWSER_ENGINES: "blink-chrome,gecko-firefox"
        run: ./test/run_race_scope.sh "${{ matrix.scope }}"
