<body>
<div class="app">

  <header class="c-top-bar" id="topbar">
    <a href="#/chat" class="c-top-bar__who" data-view="chat"><span class="c-top-bar__mark" id="bar-mark" aria-hidden="true"></span><span class="c-top-bar__name" id="p-name">&hellip;</span></a>
    <div class="c-top-bar__end">
      <span class="pill" id="pill-work" style="display:none" data-inert="an older overlay may fill it"></span>
      <span class="pill" id="pill-proj" style="display:none"></span>
      <button type="button" class="nav-item update" id="nav-update" hidden><span class="ico">&#8635;</span><span id="nav-update-text">Update</span></button>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to the light theme" title="Switch to the light theme" aria-pressed="false">
        <svg class="to-light" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5V3M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg>
        <svg class="to-dark" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/></svg>
      </button>
    </div>
  </header>
  <aside class="c-rail">
    <div class="p-state connecting" id="p-state" role="status" aria-atomic="true"><b>connecting</b></div>
    <nav class="c-top-bar__nav" id="nav" aria-label="Main">
      <a href="#/chat" class="nav-item c-top-bar__place" data-view="chat">Chat</a>
      <a href="#/projects" class="nav-item c-top-bar__place" data-view="projects">Projects</a>
      <a href="#/identity" class="nav-item c-top-bar__place" data-view="identity"><span class="c-top-bar__long">About them</span><span class="c-top-bar__short">About them</span></a>
      <a href="#/identity/record" class="nav-item c-top-bar__place c-top-bar__wide" data-view="record">Record</a>
      <a href="#/settings/permissions" class="nav-item c-top-bar__place c-top-bar__wide" data-view="plugins">Plugins</a>
      <a href="#/settings" class="nav-item c-top-bar__place" data-view="settings">Settings</a>
    </nav>
    <div class="slot" id="slot-rail"></div>
  </aside>

  <main class="stage">
    <h1 class="sr-only" id="crumb">Chat</h1>
    <div id="page-note" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="place-note" role="status" aria-live="polite"></div>
    <div id="place-head"></div>
    <div id="place-tabs"></div>

    <div id="dashboard-auth" aria-live="polite"></div>
    <div class="views" id="views">
      <section class="view on" id="view-chat">
        <div class="chat-body">
          <div class="thread" id="thread" tabindex="0" aria-label="Conversation"><div class="thread-inner" id="thread-inner"></div></div>
          <div class="fb" id="firstboot"></div>
        </div>
        <div class="composer-wrap" id="composer-wrap">
          <button class="jump-latest" id="jump-latest" type="button" hidden title="Jump to latest" aria-label="Jump to latest"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3.5 8.5 8 13l4.5-4.5"/></svg></button>
          <div class="steerq" id="steerq"></div>
          <div class="voice-transcript" id="voice-transcript" hidden></div>
          <div class="voice-filter muted" id="voice-filter" hidden></div>
          <div class="attach-chips" id="attach-chips" hidden></div>
          <div class="composer-row c-reply__box">
            <div class="composer-tools">
              <button class="attach-btn" id="attach-btn" type="button" title="Add a project or file" aria-label="Add a project or file" aria-controls="plus-menu"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
              <div class="c-reply__menu" id="plus-menu" role="menu" aria-label="Add a project or file" hidden>
                <button type="button" role="menuitem" class="c-reply__item" id="plus-files">Add files</button>
                <div class="effort" id="effort" hidden>
                  <button class="effort-btn c-reply__item" id="effort-btn" type="button" role="menuitem" aria-haspopup="menu" aria-expanded="false"><span id="effort-words">Thinking: </span><b id="effort-val"></b><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 3.5 5 7l3.5-3.5"/></svg></button>
                  <div class="effort-menu" id="effort-menu" role="menu" aria-label="Thinking" hidden></div>
                </div>
                <button type="button" role="menuitem" class="c-reply__item c-reply__model" id="plus-model" hidden><span id="plus-model-name"></span><span class="c-reply__change"> · Change</span></button>
              </div>
              <input type="file" id="attach-input" multiple hidden>
            </div>
            <div class="composer">
              <textarea id="msg-input" rows="1" placeholder="Reply to them" aria-label="Reply to them"></textarea>
            </div>
            <div class="composer-actions">
              <button class="converse" id="converse" disabled hidden aria-pressed="false" title="Start a spoken conversation" aria-label="Start a spoken conversation" data-glyph="mic"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.8" width="5" height="8.4" rx="2.5"/><path d="M3.2 7.6a4.8 4.8 0 0 0 9.6 0M8 12.4v2"/></svg></button>
              <button class="hushb" id="hush-speaking" type="button" hidden title="Stop speaking" aria-label="Stop speaking"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 6.2h2.3L8.8 3.3v9.4L5.5 9.8H3.2z"/><path d="M11.3 6.3l3.4 3.4M14.7 6.3l-3.4 3.4"/></svg></button>
              <button class="mic" id="mic" type="button" hidden aria-pressed="false" title="Talk — tap, or hold"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.8" width="5" height="8.4" rx="2.5"/><path d="M3.2 7.6a4.8 4.8 0 0 0 9.6 0M8 12.4v2"/></svg></button>
              <div class="mic-more-wrap">
                <button class="mic-more" id="mic-more" type="button" hidden aria-haspopup="menu" aria-expanded="false" title="Voice" aria-label="Voice"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 3.5 5 7l3.5-3.5"/></svg></button>
                <div class="mic-menu" id="mic-menu" role="menu" aria-label="Voice" hidden>
                  <div class="mic-voice" id="mic-voice" hidden></div>
                  <div class="mic-mode" id="mic-mode" hidden></div>
                <div class="mic-source" id="mic-source"></div>
                  <div class="mic-inputs" id="mic-inputs" hidden></div>
                  <button type="button" role="menuitemradio" aria-checked="false" id="mic-meeting" hidden>Meeting &mdash; record the room, don&rsquo;t speak</button>
                  <button type="button" role="menuitem" id="mic-settings">Voice settings</button>
                </div>
              </div>
              <button class="sendb" id="send-btn" title="Send" aria-label="Send"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></button>
            </div>
          </div>
          <p class="c-reply__line" id="reply-line"></p>
        </div>
      </section>
      <section class="view" id="view-projects">
        <div class="proj-space" id="proj-space"></div>

        <div class="dock-wrap"><div class="dock-tools"><input type="search" id="dock-filter" placeholder="Filter projects&hellip;" autocomplete="off" spellcheck="false" aria-label="Filter projects"></div><div class="dock" id="dock"></div></div>
      </section>
      <section class="view" id="view-memory"><div class="stack" id="memory-stack"></div></section>
      <section class="view" id="view-identity"><div class="stack" id="identity-stack"></div></section>
      <section class="view" id="view-between"><div class="stack" id="between-stack"></div></section>
      <section class="view" id="view-experiences"><div class="stack" id="experiences-stack"></div></section>
      <section class="view" id="view-plugins"><div class="stack" id="plugins-stack"></div></section>
      <section class="view" id="view-status"><div class="stack" id="status-stack"></div></section>
      <section class="view" id="view-settings"><div class="stack" id="settings-stack"></div></section>

    </div>

    <div class="slot" id="slot-dock"></div>
  </main>

  <aside class="slot panel-col" id="slot-panel"></aside>
</div>

<div class="slot slot-overlay" id="slot-overlay"></div>
<div class="sr-only" id="announce" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="./app.js"></script>
<script type="module" src="./recovery.js"></script>

<script type="module" src="./custom.js"></script>
</body>
